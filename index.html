<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Сервис Заботы — SEGA Edition</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #38adff;
      background-image: linear-gradient(to bottom, #1e82e6 0%, #38adff 50%, #70c5ff 80%, #a2dcff 100%);
      overflow-x: hidden;
      image-rendering: pixelated;
    }

    /* Пиксельные ретро-рамки SEGA */
    .pixel-box {
      border: 3px solid #0f172a;
      box-shadow: 4px 4px 0px #0f172a;
    }

    .pixel-button {
      border: 3px solid #0f172a;
      box-shadow: 0px 4px 0px #0f172a;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .pixel-button:active {
      transform: translate3d(0, 3px, 0);
      box-shadow: 0px 1px 0px #0f172a;
    }

    /* Плавные облака */
    @keyframes driftSmooth {
      0% { transform: translate3d(-100%, 0, 0); }
      100% { transform: translate3d(100vw, 0, 0); }
    }

    .cloud-layer-1 {
      animation: driftSmooth 38s linear infinite;
      will-change: transform;
    }

    .cloud-layer-2 {
      animation: driftSmooth 58s linear infinite 18s;
      will-change: transform;
    }

    @keyframes subtlePulse {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -3px, 0); }
    }

    .badge-float {
      animation: subtlePulse 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 p-4 pb-6 flex flex-col items-center justify-between select-none relative overflow-x-hidden">

  <!-- ================= ПИКСЕЛЬНЫЙ ФОН SEGA (ГОРЫ И ОБЛАКА) ================= -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <!-- Облако 1 -->
    <div class="absolute top-6 left-0 cloud-layer-1 opacity-90">
      <svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 20H30V10H60V0H90V10H110V20H120V40H0V30H10V20H20Z" fill="white"/>
        <path d="M20 30H100V40H0V30H20Z" fill="#dbeafe"/>
      </svg>
    </div>

    <!-- Облако 2 -->
    <div class="absolute top-24 left-0 cloud-layer-2 opacity-80">
      <svg width="90" height="30" viewBox="0 0 90 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 15H25V8H45V0H70V8H80V15H90V30H0V22H10V15H15Z" fill="white"/>
        <path d="M10 22H80V30H0V22H10Z" fill="#dbeafe"/>
      </svg>
    </div>

    <!-- Фиолетовые горы SEGA -->
    <div class="absolute bottom-0 left-0 right-0 h-32 opacity-85 flex items-end">
      <svg class="w-full h-24" viewBox="0 0 400 100" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 100 L40 40 L80 100 L140 20 L200 100 L260 35 L320 100 L370 50 L400 100 Z" fill="#8b5cf6" opacity="0.6"/>
        <path d="M0 100 L60 50 L120 100 L180 40 L240 100 L300 60 L360 100 L400 70 L400 100 Z" fill="#7c3aed" opacity="0.85"/>
      </svg>
    </div>
  </div>
  <!-- ========================================================================= -->

  <!-- Главный контейнер -->
  <div class="w-full max-w-sm flex flex-col items-center z-10 relative">
    
    <!-- Шапка -->
    <header class="text-center my-3 w-full flex flex-col items-center">
      <div class="inline-flex items-center gap-1.5 bg-white text-rose-500 px-3.5 py-1 text-xs font-bold rounded-full pixel-box mb-3 badge-float">
        <span>✨</span> Ты 24/7
      </div>

      <!-- Динамический заголовок -->
      <div class="bg-white/95 backdrop-blur p-3.5 pixel-box rounded-2xl w-full mb-2.5">
        <h1 id="greeting-title" class="text-xl font-bold text-rose-600 tracking-tight min-h-[32px] flex items-center justify-center gap-1">
          Привет, конфетка ☀️
        </h1>
      </div>

      <!-- Изящный подзаголовок -->
      <div class="inline-block px-3 py-1 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white text-[11px] font-medium tracking-wide shadow-sm">
        Вот что есть для тебя
      </div>
    </header>

    <!-- Меню выбора -->
    <main class="w-full space-y-3 mt-1">
      
      <!-- Комплимент -->
      <button onclick="showCompliment()" class="w-full bg-rose-400 hover:bg-rose-500 text-white p-3.5 pixel-button rounded-2xl flex items-center justify-between group active:bg-rose-600">
        <div class="flex items-center space-x-3.5">
          <span class="text-2xl">💌</span>
          <div class="text-left">
            <div class="font-bold text-sm leading-tight">Комплимент дня</div>
            <div class="text-xs text-rose-100 font-medium mt-0.5">Зарядиться любовью</div>
          </div>
        </div>
        <span class="text-lg font-bold group-hover:translate-x-1 transition-transform">›</span>
      </button>

      <!-- Фото -->
      <button onclick="showPhoto()" class="w-full bg-purple-400 hover:bg-purple-500 text-white p-3.5 pixel-button rounded-2xl flex items-center justify-between group active:bg-purple-600">
        <div class="flex items-center space-x-3.5">
          <span class="text-2xl">📸</span>
          <div class="text-left">
            <div class="font-bold text-sm leading-tight">Забавные фото</div>
            <div class="text-xs text-purple-100 font-medium mt-0.5">С тобой, со мной и нашими попсиками</div>
          </div>
        </div>
        <span class="text-lg font-bold group-hover:translate-x-1 transition-transform">›</span>
      </button>

      <!-- Купоны -->
      <button onclick="showCoupons()" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 p-3.5 pixel-button rounded-2xl flex items-center justify-between group active:bg-amber-600">
        <div class="flex items-center space-x-3.5">
          <span class="text-2xl">🎟</span>
          <div class="text-left">
            <div class="font-bold text-sm leading-tight">Купоны желаний</div>
            <div class="text-xs text-amber-900 font-medium mt-0.5">Выбирай, что понравится</div>
          </div>
        </div>
        <span class="text-lg font-bold group-hover:translate-x-1 transition-transform">›</span>
      </button>

      <!-- План -->
      <button onclick="showPlan()" class="w-full bg-sky-400 hover:bg-sky-500 text-white p-3.5 pixel-button rounded-2xl flex items-center justify-between group active:bg-sky-600">
        <div class="flex items-center space-x-3.5">
          <span class="text-2xl">📍</span>
          <div class="text-left">
            <div class="font-bold text-sm leading-tight">План на вечер</div>
            <div class="text-xs text-sky-100 font-medium mt-0.5">Выбери время для прогулки</div>
          </div>
        </div>
        <span class="text-lg font-bold group-hover:translate-x-1 transition-transform">›</span>
      </button>

    </main>
  </div>

  <!-- Элегантный адаптивный футер -->
  <footer class="mt-8 text-center z-10 w-full relative">
    <div class="inline-flex items-center gap-1.5 bg-purple-950/40 backdrop-blur-md border border-purple-300/30 px-3.5 py-1 rounded-full text-[11px] font-medium text-purple-100/90 shadow-sm">
      <span>С любовью для Санечки</span>
      <span class="text-rose-400">❤️</span>
    </div>
  </footer>

  <!-- Модальное окно -->
  <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white p-5 max-w-xs w-full pixel-box rounded-3xl text-center space-y-4 relative">
      <div id="modal-content" class="text-slate-800 text-sm"></div>
      <div id="modal-buttons" class="space-y-2 pt-1">
        <!-- Кнопки -->
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg && typeof tg.expand === 'function') {
      tg.expand();
    }

    // Использованные купоны приходят от бота через ссылку: ?used=win,coffee
    const USED = new Set(
      (new URLSearchParams(location.search).get('used') || '').split(',').filter(Boolean)
    );
    const COUPONS = [
      { id: 'win', icon: '👑', title: 'Победа в любом споре' },
      { id: 'truth',   icon: '😚', title: 'Правда или действие' },
      { id: 'telegram',   icon: '💌', title: 'Telegram Premium' },
      { id: 'hands',  icon: '🫂', title: '«Хочу на ручки»' },
      { id: 'sweets',  icon: '🍬', title: 'Вкусняшки' }
    ];

    let audioCtx = null;
    
    function playRetroSound(freq = 440, type = 'square', duration = 0.08) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Игнорируем блокировки автозвука
      }
    }

    const GREETINGS = [
      "С возвращением, пупсик 🥰",
      "Рад тебя видеть, детка ❤️",
      "Привет, конфетка 🍭",
      "Здравствуй, красавица 💝",
      "Милая 🥹",
      "Соскучилась? Я тоже ☺️",
      "Такая ты детка 😘",
      "🎀🎀🎀",
      "Привет, цветочек 🌸"
    ];

    const COMPLIMENTS = [
      "Твои губы 🥹",
      "Мне нравится, как ты шутишь",
      "Нравится с тобой целоваться",
      "У тебя красивые руки",
      "Будем сосаться сегодня?",
      "Хочется обнять тебя",
      "Горжусь тобой",
      "Ты самостоятельная, это восхищает",
      "Ты очень красивая",
      "У тебя красивые ножки",
      "Твоя фигура 😍",
      "Пиццу или суши?",
      "Ты вкусно пахнешь",
      "Нравится твоя эстетика",
      "Люблю твой смех, кваки и хрюки",
      "Ты эмпатична",
      "Ты вау-мяу",
      "Выглядишь прекрасно",
      "10 из 10"
    ];

    const PHOTOS = [
      {
        src: "photo.jpg",
        title: "Моджиточник 😋",
        desc: "В тот день к тебе на работу пришла мама с Мошкой"
      },
      {
        src: "photo2.jpg",
        title: "Мем",
        desc: "Кажется, что одновременно похож и на Севку, и на Мошку"
      },
      {
        src: "photo3.jpg",
        title: "Весенний денёк 🌅",
        desc: "Сделали классные фото в тот день"
      },
      {
        src: "photo4.jpg",
        title: "Шо за тип",
        desc: "Ты всегда меня так загадочно фоткаешь"
      },
      {
        src: "photo5.jpg",
        title: "Соус соус соус",
        desc: "Вкусненький соус"
      },
      {
        src: "photo6.jpg",
        title: "😆",
        desc: "..."
      }, 
      {
        src: "photo7.jpg",
        title: "Фонар",
        desc: "Когда ещё поиграем, кстати?"
      }
    ];

        function makeShuffler(items) {
      let queue = [];
      let last = null;
      return function next() {
        if (queue.length === 0) {
          queue = [...items];
          for (let i = queue.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [queue[i], queue[j]] = [queue[j], queue[i]];
          }
          // чтобы последний показанный не выпал первым в новом круге
          if (queue.length > 1 && queue[queue.length - 1] === last) {
            [queue[0], queue[queue.length - 1]] = [queue[queue.length - 1], queue[0]];
          }
        }
        last = queue.pop();
        return last;
      };
    }

    const nextCompliment = makeShuffler(COMPLIMENTS);
    const nextPhoto = makeShuffler(PHOTOS);

    function setRandomGreeting() {
      try {
        const el = document.getElementById('greeting-title');
        if (!el) return;
        
        const randomText = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];
        const emojiMatch = randomText.match(/[\p{Extended_Pictographic}\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]+/gu);
        
        if (emojiMatch) {
          const emojis = emojiMatch.join(' ');
          const cleanText = randomText.replace(/[\p{Extended_Pictographic}\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
          el.innerHTML = `<span>${cleanText}</span> <span class="font-normal inline-block ml-1">${emojis}</span>`;
        } else {
          el.textContent = randomText;
        }
      } catch (err) {
        console.log("Greeting error:", err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setRandomGreeting);
    } else {
      setRandomGreeting();
    }

    function triggerHapticAndSound(soundFreq = 520) {
      playRetroSound(soundFreq, 'square', 0.08);
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    function openModal(htmlContent, buttonsHtml = '') {
      triggerHapticAndSound(580);
      document.getElementById('modal-content').innerHTML = htmlContent;
      
      const buttonsContainer = document.getElementById('modal-buttons');
      if (buttonsHtml) {
        buttonsContainer.innerHTML = buttonsHtml;
      } else {
        buttonsContainer.innerHTML = `
          <button onclick="closeModal()" class="w-full py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-bold pixel-button rounded-xl text-xs">
            В меню 💕
          </button>
        `;
      }
      
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      triggerHapticAndSound(320);
      document.getElementById('modal').classList.add('hidden');
    }

    function showCompliment() {
      const text = nextCompliment();
      
      const content = `
        <div class="text-3xl mb-2">💌</div>
        <p class="font-semibold text-gray-800 text-sm leading-relaxed">${text}</p>
      `;

      const buttons = `
        <button onclick="showCompliment()" class="w-full py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-bold pixel-button rounded-xl text-xs">
          Давай ещё 💖
        </button>
        <button onclick="closeModal()" class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-slate-700 font-medium rounded-xl text-xs">
          В меню
        </button>
      `;

      openModal(content, buttons);
    }

    function showPhoto() {
      const currentPhoto = nextPhoto();

      const content = `
        <div class="p-1 bg-slate-900 pixel-box rounded-xl mb-3 overflow-hidden">
          <img src="${currentPhoto.src}" class="w-full h-auto max-h-56 object-contain rounded-lg" alt="Memory" onerror="this.onerror=null; this.src='photo.jpg';" />
        </div>
        <p class="font-bold text-rose-600 text-sm">${currentPhoto.title}</p>
        <p class="text-xs text-gray-500 mt-0.5">${currentPhoto.desc}</p>
      `;

      const buttons = `
        <button onclick="showPhoto()" class="w-full py-2.5 bg-purple-500 hover:bg-purple-600 text-white font-bold pixel-button rounded-xl text-xs">
          Ещё фотку 📸
        </button>
        <button onclick="closeModal()" class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-slate-700 font-medium rounded-xl text-xs">
          В меню
        </button>
      `;

      openModal(content, buttons);
    }

    function showCoupons() {
      const items = COUPONS.map(c => USED.has(c.id)
        ? `<div class="w-full text-left p-2.5 bg-gray-100 border border-gray-200 rounded-xl text-xs font-semibold text-gray-400 flex items-center justify-between">
             <span class="line-through">${c.icon} ${c.title}</span>
             <span>Исполнено ✨</span>
           </div>`
        : `<button onclick="useCoupon('${c.id}')" class="w-full text-left p-2.5 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl text-xs font-semibold text-slate-800 flex items-center justify-between">
             <span>${c.icon} ${c.title}</span>
             <span class="text-rose-600 font-bold">Выбрать</span>
           </button>`
      ).join('');

      const content = `
        <div class="text-3xl mb-1">🎟</div>
        <h3 class="font-bold text-slate-900 text-sm mb-3">Чем тебя порадовать?</h3>
        <div class="space-y-2">${items}</div>
      `;

      const buttons = `
        <button onclick="closeModal()" class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-slate-700 font-medium rounded-xl text-xs">
          В меню
        </button>
      `;

      openModal(content, buttons);
    }

    function useCoupon(id) {
      if (USED.has(id)) return;
      USED.add(id);
      const coupon = COUPONS.find(c => c.id === id);
      playRetroSound(880, 'square', 0.15);

      const content = `
        <div class="text-3xl mb-2">🎉</div>
        <p class="font-bold text-emerald-600 text-sm">Купон активирован!</p>
        <p class="text-xs text-gray-600 mt-1.5">«${coupon.icon} ${coupon.title}»<br>Я уже получил уведомление ❤️</p>
      `;

      const buttons = `
        <button onclick="closeModal()" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold pixel-button rounded-xl text-xs">
          Отлично 💕
        </button>
      `;

      openModal(content, buttons);

      // После sendData приложение закрывается, поэтому даём время увидеть экран
      setTimeout(() => {
        if (tg && tg.sendData) {
          tg.sendData(JSON.stringify({ action: 'use_coupon', coupon: id }));
        }
      }, 1500);
    }

    function showPlan() {
      const weekdays = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      const pad = n => String(n).padStart(2, '0');

      // Подсказка в списке серая и не выбирается как значение (disabled hidden)
      let dateOptions = '<option value="" disabled selected hidden>Например, завтра</option>';
      for (let i = 0; i < 30; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const prefix = i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : weekdays[d.getDay()];
        dateOptions += `<option value="${value}" style="color:#1e293b">${prefix}, ${pad(d.getDate())}.${pad(d.getMonth() + 1)}</option>`;
      }

      let timeOptions = '<option value="" disabled selected hidden>Часиков в 4</option>';
      for (let h = 10; h <= 22; h++) {
        timeOptions += `<option value="${pad(h)}:00" style="color:#1e293b">${pad(h)}:00</option>`;
        if (h < 22) timeOptions += `<option value="${pad(h)}:30" style="color:#1e293b">${pad(h)}:30</option>`;
      }

      // Пока ничего не выбрано, текст серый; после выбора становится тёмным
      const onPick = "this.style.color='#1e293b'; document.getElementById('plan-error').classList.add('hidden')";
      const selectClass = 'w-full px-3 rounded-xl border-2 border-sky-200 bg-white font-normal';
      const selectStyle = 'height:46px; font-size:16px; color:#94a3b8;';

      const content = `
        <div class="text-3xl mb-1">🍂</div>
        <p class="font-bold text-sky-600 text-base mb-3">Приглашение на прогулку</p>

        <div class="bg-sky-50 border-2 border-sky-100 rounded-2xl p-3 mb-3 space-y-2 text-left">
          <div class="flex items-start gap-2.5">
            <span class="text-lg leading-none">☕</span>
            <span class="text-xs text-slate-700 leading-snug">С кофе или какао</span>
          </div>
          <div class="flex items-start gap-2.5">
            <span class="text-lg leading-none">⏱</span>
            <span class="text-xs text-slate-700 leading-snug">Примерно час-полтора</span>
          </div>
          <div class="flex items-start gap-2.5">
            <span class="text-lg leading-none">🫶</span>
            <span class="text-xs text-slate-700 leading-snug">Ничего особенного, но важно: держимся за руки и тактильничаем</span>
          </div>
        </div>

        <p class="text-xs text-slate-600 leading-snug mb-3">
          Выбери день и время, когда тебе удобно, а я подстроюсь
        </p>

        <div class="space-y-2.5 text-left">
          <div>
            <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide mb-1">Дата</div>
            <select id="plan-date" onchange="${onPick}" class="${selectClass}" style="${selectStyle}">${dateOptions}</select>
          </div>
          <div>
            <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide mb-1">Время</div>
            <select id="plan-time" onchange="${onPick}" class="${selectClass}" style="${selectStyle}">${timeOptions}</select>
          </div>
          <p id="plan-error" class="text-xs text-rose-600 font-semibold hidden">Выбери и дату, и время 🙂</p>
        </div>
      `;

      const buttons = `
        <button onclick="submitPlan()" class="w-full py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-bold pixel-button rounded-xl text-xs">
          Отправить 💌
        </button>
        <button onclick="closeModal()" class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-slate-700 font-medium rounded-xl text-xs">
          Назад
        </button>
      `;

      openModal(content, buttons);
    }

    function submitPlan() {
      const date = document.getElementById('plan-date').value;
      const time = document.getElementById('plan-time').value;
      if (!date || !time) {
        document.getElementById('plan-error').classList.remove('hidden');
        return;
      }
      playRetroSound(880, 'square', 0.15);

      const [y, m, d] = date.split('-');
      const content = `
        <div class="text-3xl mb-2">💕</div>
        <p class="font-bold text-emerald-600 text-sm">Отправлено!</p>
        <p class="text-xs text-gray-600 mt-1.5">${d}.${m}.${y} в ${time}<br>Понел-принял, скоро всё подтвержу ❤️</p>
      `;
      const buttons = `
        <button onclick="closeModal()" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold pixel-button rounded-xl text-xs">
          Отлично 💕
        </button>
      `;
      openModal(content, buttons);

      // После sendData приложение закрывается, поэтому даём время увидеть экран
      setTimeout(() => {
        if (tg && tg.sendData) {
          tg.sendData(JSON.stringify({ action: 'plan_time', date: date, time: time }));
        }
      }, 1500);
    }
  </script>
</body>
</html>
